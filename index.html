<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Matrix Verde</title>

<style>
:root { --accent: #0F0; }

body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
}

/* MATRIX FUNDO */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

/* BOTÕES */
#music-btn, #next-btn {
  position: fixed;
  top: 15px;
  padding: 10px 20px;
  border: 2px solid var(--accent);
  color: var(--accent);
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  z-index: 1000;
}

#music-btn { left: 50%; transform: translateX(-110%); }
#next-btn { left: 50%; transform: translateX(10%); }

/* PERFIL */
#links-panel {
  position: fixed;
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.profile-container {
  position: relative;
  width: 360px;
  height: 210px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 20px var(--accent);
}

.profile-banner {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 1;
}

.profile-img {
  position: absolute;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 3px solid var(--accent);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* LINKS */
#links-panel a {
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--accent);
  padding: 8px 12px;
  border-radius: 6px;
  min-width: 200px;
  text-align: center;
}

/* CHAT */
#chat-box {
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 300px;
  height: 200px;
  border: 1px solid var(--accent);
}

#chat-header {
  color: var(--accent);
  padding: 5px;
}

#chat-messages {
  height: 160px;
  overflow-y: auto;
  font-size: 12px;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<audio id="bg-music"></audio>

<button id="music-btn">▶ Música</button>
<button id="next-btn">⏭ Pular</button>

<div id="links-panel">
  <div class="profile-container">
    <img src="banner.gif" class="profile-banner">
    <img src="minha-foto.jpg" class="profile-img">
  </div>

  <a href="#">YouTube</a>
  <a href="#">Twitter</a>
  <a href="#">Twitch</a>
  <a href="#">Kick</a>
</div>

<div id="chat-box">
  <div id="chat-header">Chat</div>
  <div id="chat-messages"></div>
</div>

<script>
// MATRIX
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 16;
let columns = canvas.width / fontSize;
let drops = Array(Math.floor(columns)).fill(1);

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#0F0";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }

    drops[i]++;
  }
}
setInterval(draw, 50);

// 🎵 PLAYLIST
const playlist = ["musica1.mp3","musica2.mp3","musica3.mp3"];
let currentTrack = 0;

const player = document.getElementById("bg-music");
const btn = document.getElementById("music-btn");
const nextBtn = document.getElementById("next-btn");

player.src = playlist[currentTrack];

let playing = false;

btn.addEventListener("click", async () => {
  if (!playing) {
    await player.play();
    btn.textContent = "⏸ Música";
    playing = true;
  } else {
    player.pause();
    btn.textContent = "▶ Música";
    playing = false;
  }
});

function nextTrack() {
  currentTrack = (currentTrack + 1) % playlist.length;
  player.src = playlist[currentTrack];
  if (playing) player.play();
}

nextBtn.addEventListener("click", nextTrack);
player.addEventListener("ended", nextTrack);

// CHAT
const chat = document.getElementById("chat-messages");

setInterval(() => {
  const msg = document.createElement("div");
  msg.textContent = "Mensagem da Matrix...";
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}, 3000);
</script>

</body>
</html>
