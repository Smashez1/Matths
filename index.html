<style>
:root { --accent: #0F0; }

#smashez-nick {
  position: relative;
  font-size: 32px;
  font-weight: bold;
  color: var(--accent);
  text-align: center;
  animation: glow 2.5s infinite;
  transform: translateY(-9px);
  background: #000;
  padding: 6px 24px;
  border-radius: 8px;
  margin-top: 60px;
}

@keyframes glow {
  0% { text-shadow: 0 0 2px var(--accent); }
  50% { text-shadow: 0 0 8px var(--accent), 0 0 4px #fff; }
  100% { text-shadow: 0 0 2px var(--accent); }
}

/* ===== Efeito Glitch no nome ===== */
#smashez-nick::before,
#smashez-nick::after {
  content: attr(data-text);
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  color: var(--accent);
  background: #000;
  opacity: 0;
  pointer-events: none;
  padding: 6px 24px;
  border-radius: 8px;
  box-sizing: border-box;
}
#smashez-nick.glitching::before {
  left: 3px;
  text-shadow: -2px 0 #ff003c;
  background: transparent;
  clip-path: polygon(0 15%, 100% 15%, 100% 20%, 0 20%);
  animation: glitchTop 0.4s steps(2, end) infinite;
  opacity: 0.9;
}
#smashez-nick.glitching::after {
  left: -3px;
  text-shadow: 2px 0 #00fff9;
  background: transparent;
  clip-path: polygon(0 60%, 100% 60%, 100% 66%, 0 66%);
  animation: glitchBottom 0.35s steps(2, end) infinite;
  opacity: 0.9;
}
@keyframes glitchTop {
  0%{ clip-path: polygon(0 15%, 100% 15%, 100% 20%, 0 20%); transform: translate(-3px,-1px); }
  20%{ clip-path: polygon(0 45%, 100% 45%, 100% 52%, 0 52%); transform: translate(3px,1px); }
  40%{ clip-path: polygon(0 5%, 100% 5%, 100% 12%, 0 12%); transform: translate(-2px,0); }
  60%{ clip-path: polygon(0 70%, 100% 70%, 100% 78%, 0 78%); transform: translate(2px,1px); }
  80%{ clip-path: polygon(0 30%, 100% 30%, 100% 38%, 0 38%); transform: translate(-3px,-2px); }
  100%{ clip-path: polygon(0 85%, 100% 85%, 100% 90%, 0 90%); transform: translate(3px,0); }
}
@keyframes glitchBottom {
  0%{ clip-path: polygon(0 25%, 100% 25%, 100% 30%, 0 30%); transform: translate(2px,0); }
  25%{ clip-path: polygon(0 60%, 100% 60%, 100% 68%, 0 68%); transform: translate(-2px,1px); }
  50%{ clip-path: polygon(0 10%, 100% 10%, 100% 18%, 0 18%); transform: translate(3px,-1px); }
  75%{ clip-path: polygon(0 80%, 100% 80%, 100% 88%, 0 88%); transform: translate(-3px,1px); }
  100%{ clip-path: polygon(0 40%, 100% 40%, 100% 48%, 0 48%); transform: translate(2px,0); }
}

/* 🔊 VOLUME */

/* ===== EFEITO CRT / SCANLINE ===== */
#crt-overlay {
  position: fixed;
  inset: 0;
  z-index: 9500;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 2px,
      transparent 3px
    );
  mix-blend-mode: multiply;
  animation: crtFlicker 6s infinite;
}
#crt-overlay::before {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 140px 40px rgba(0,0,0,0.65);
  pointer-events: none;
}
@keyframes crtFlicker {
  0%, 96%, 100% { opacity: 1; }
  97% { opacity: 0.86; }
  98% { opacity: 1; }
  99% { opacity: 0.9; }
}
@media (prefers-reduced-motion: reduce) {
  #crt-overlay { animation: none; }

// MATRIX
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*";
const fontSize = 16;
let columns = canvas.width / fontSize;
let drops = Array(Math.floor(columns)).fill(1);
let color = "#0F0";

// RASTRO DO MOUSE
const trailParticles = [];

window.addEventListener("mousemove", (e) => {
  // adiciona só ocasionalmente para ficar discreto
  if (Math.random() > 0.5) return;
  trailParticles.push({
    x: e.clientX,
    y: e.clientY,
    char: letters[Math.floor(Math.random() * letters.length)],
    alpha: 0.5
  });
});

function drawTrail() {
  ctx.font = fontSize + "px monospace";
  const rgb = color === "#0F0" ? "0, 255, 0" : "255, 0, 0";
  for (let i = trailParticles.length - 1; i >= 0; i--) {
    const p = trailParticles[i];
    ctx.fillStyle = `rgba(${rgb}, ${p.alpha})`;
    ctx.fillText(p.char, p.x, p.y);
    p.alpha -= 0.03;
    p.y += 0.5;
    if (p.alpha <= 0) {
      trailParticles.splice(i, 1);
    }
  }
}

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = color;
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }

  drawTrail();
}
setInterval(draw, 50);

// TROCA COR

// 🖼️ BANNERS (um para cada música, na mesma ordem/posição da playlist)
// Troque os nomes dos arquivos abaixo pelos gifs/imagens que você quiser usar.
const banners = [

  "banner/banner5.gif",

];

let currentTrack = 0;
const player = document.getElementById("bg-music");
const btn = document.getElementById("music-btn");
const nextBtn = document.getElementById("next-btn");
const prevBtn = document.getElementById("prev-btn");
const bannerImg = document.getElementById("profile-banner");

function updateBanner() {
  // troca o banner com um crossfade suave em vez de um corte seco
  if (!banners[currentTrack]) return;

  bannerImg.style.opacity = 0;

  setTimeout(() => {
    bannerImg.src = banners[currentTrack];
  }, 450);

  bannerImg.onload = () => {
    bannerImg.style.opacity = 1;
  };
}

player.src = playlist[currentTrack];
updateBanner();
let playing = false;

btn.addEventListener("click", async () => {
  if (!playing) {
    await player.play();
    btn.textContent = "⏸ Música";
    playing = true;
  } else {
    player.pause();
    btn.textContent = "▶ Música";
    playing = false;
  }
});

function nextTrack() {
  currentTrack = (currentTrack + 1) % playlist.length;
  player.src = playlist[currentTrack];
  updateBanner();
  if (playing) player.play();
}

function prevTrack() {
  currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
  player.src = playlist[currentTrack];
  updateBanner();
  if (playing) player.play();
}

nextBtn.addEventListener("click", nextTrack);
prevBtn.addEventListener("click", prevTrack);
player.addEventListener("ended", nextTrack);

// 🔊 VOLUME SCRIPT
const volumeSlider = document.getElementById("volume-slider");
const volumeIcon = document.getElementById("volume-icon");

volumeSlider.value = 0.5;
player.volume = 0.5;

volumeSlider.addEventListener("input", () => {
  player.volume = volumeSlider.value;
  if (volumeSlider.value == 0) {
    volumeIcon.textContent = "🔇";
  } else if (volumeSlider.value < 0.5) {
    volumeIcon.textContent = "🔉";
  } else {
    volumeIcon.textContent = "🔊";
  }
});

const chatBox = document.getElementById("chat-messages");
let index = 0;
let loopIndex = 0;

function addMensagem() {
  const msg = document.createElement("div");
  msg.classList.add("msg");

  if (index < mensagens.length) {
    msg.innerHTML = mensagens[index];
    index++;
  } else {
    msg.innerHTML = mensagensLoop[loopIndex];
    loopIndex++;
    if (loopIndex >= mensagensLoop.length) {
      loopIndex = 0; // reinicia o loop
    }
  }

  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight; // rola pra baixo
}

// adiciona uma mensagem a cada 5 segundos
setInterval(addMensagem, 5000);
