<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Matrix Hacker Full</title>

<style>
:root { --accent: #0F0; }

body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
}

/* MATRIX */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

/* LOGIN HACKER */
#login-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

.login-box {
  border: 2px solid var(--accent);
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 0 20px var(--accent);
  width: 400px;
}

#terminal {
  color: var(--accent);
  font-size: 14px;
  white-space: pre-wrap;
}

/* BOTÕES */
#music-btn, #next-btn {
  position: fixed;
  top: 15px;
  padding: 10px 20px;
  border: 2px solid var(--accent);
  color: var(--accent);
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  z-index: 1000;
}

#music-btn { left: 50%; transform: translateX(-110%); }
#next-btn { left: 50%; transform: translateX(10%); }

/* PERFIL */
#links-panel {
  position: fixed;
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.profile-container {
  position: relative;
  width: 360px;
  height: 210px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 20px var(--accent);
}

.profile-banner {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-img {
  position: absolute;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 3px solid var(--accent);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* LINKS */
#links-panel a {
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--accent);
  padding: 8px 12px;
  border-radius: 6px;
  min-width: 200px;
  text-align: center;
  transition: 0.3s;
}

#links-panel a:hover {
  color: #fff;
  box-shadow: 0 0 10px var(--accent),
              0 0 20px var(--accent),
              0 0 40px var(--accent);
  text-shadow: 0 0 5px #fff,
               0 0 10px var(--accent);
  transform: scale(1.05);
}

/* CHAT */
#chat-box {
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 320px;
  height: 240px;
  border: 1px solid var(--accent);
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  border-radius: 8px;
}

#chat-header {
  color: var(--accent);
  padding: 5px;
}

#chat-messages {
  height: 200px;
  overflow-y: auto;
  font-size: 12px;
}

.msg {
  margin: 4px;
  color: #FFF;
  text-shadow: 0 0 3px rgba(255,255,255,0.3);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <pre id="terminal"></pre>
  </div>
</div>

<canvas id="matrix"></canvas>

<audio id="bg-music"></audio>

<button id="music-btn">▶ Música</button>
<button id="next-btn">⏭ Pular</button>

<div id="links-panel">
  <div class="profile-container">
    <img src="banner.gif" class="profile-banner">
    <img src="minha-foto.jpg" class="profile-img">
  </div>

  <a href="#">YouTube</a>
  <a href="#">Twitter</a>
  <a href="#">Twitch</a>
  <a href="#">Kick</a>
</div>

<div id="chat-box">
  <div id="chat-header">Chat</div>
  <div id="chat-messages"></div>
</div>

<script>
// LOGIN HACKER
const terminal = document.getElementById("terminal");

const lines = [
  "Iniciando sistema...",
  "Conectando ao servidor...",
  "Bypass firewall...",
  "Acessando banco de dados...",
  "Usuário encontrado: admin",
  "Quebrando senha...",
  "Senha descoberta: ********",
  "Autenticando...",
  "ACESSO LIBERADO ✔"
];

let lineIndex = 0;
let charIndex = 0;

function typeEffect() {
  if (lineIndex < lines.length) {
    if (charIndex < lines[lineIndex].length) {
      terminal.textContent += lines[lineIndex].charAt(charIndex);
      charIndex++;
      setTimeout(typeEffect, 35);
    } else {
      terminal.textContent += "\n";
      lineIndex++;
      charIndex = 0;
      setTimeout(typeEffect, 250);
    }
  } else {
    setTimeout(() => {
      document.getElementById("login-screen").style.display = "none";
    }, 800);
  }
}

typeEffect();

// MATRIX
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*";
const fontSize = 16;
let columns = canvas.width / fontSize;
let drops = Array(Math.floor(columns)).fill(1);

let color = "#0F0";

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = color;
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}
setInterval(draw, 50);

// resto do seu código continua igual...
</script>

</body>
</html>
