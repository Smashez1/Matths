// MATRIX
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*";
const fontSize = 16;
let columns = canvas.width / fontSize;
let drops = Array(Math.floor(columns)).fill(1);
let color = "#0F0";

// RASTRO DO MOUSE
const trailParticles = [];

window.addEventListener("mousemove", (e) => {
  // adiciona só ocasionalmente para ficar discreto
  if (Math.random() > 0.5) return;
  trailParticles.push({
    x: e.clientX,
    y: e.clientY,
    char: letters[Math.floor(Math.random() * letters.length)],
    alpha: 0.5
  });
});

function drawTrail() {
  ctx.font = fontSize + "px monospace";
  const rgb = color === "#0F0" ? "0, 255, 0" : "255, 0, 0";
  for (let i = trailParticles.length - 1; i >= 0; i--) {
    const p = trailParticles[i];
    ctx.fillStyle = `rgba(${rgb}, ${p.alpha})`;
    ctx.fillText(p.char, p.x, p.y);
    p.alpha -= 0.03;
    p.y += 0.5;
    if (p.alpha <= 0) {
      trailParticles.splice(i, 1);
    }
  }
}

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = color;
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }

  drawTrail();
}
setInterval(draw, 50);

// TROCA COR

  color = (color === "#0F0") ? "#F00" : "#0F0";

const prevBtn = document.getElementById("prev-btn");
const bannerImg = document.getElementById("profile-banner");

function updateBanner() {
  // usa o banner correspondente à faixa atual; se não houver, mantém o último
  if (banners[currentTrack]) {
    bannerImg.src = banners[currentTrack];
  }
}

player.src = playlist[currentTrack];
updateBanner();
let playing = false;

btn.addEventListener("click", async () => {
  if (!playing) {
    await player.play();
    btn.textContent = "⏸ Música";
    playing = true;
  } else {
    player.pause();
    btn.textContent = "▶ Música";
    playing = false;
  }
});

function nextTrack() {
  currentTrack = (currentTrack + 1) % playlist.length;
  player.src = playlist[currentTrack];
  updateBanner();
  if (playing) player.play();
}

function prevTrack() {
  currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
  player.src = playlist[currentTrack];
  updateBanner();
  if (playing) player.play();
}

nextBtn.addEventListener("click", nextTrack);
prevBtn.addEventListener("click", prevTrack);

const chatBox = document.getElementById("chat-messages");

function addMensagem() {
