<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Matrix Hacker Full</title>

<style>
:root { --accent: #0F0; }

body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
}

/* MATRIX */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

/* BOTÕES */
#music-btn, #next-btn {
  position: fixed;
  top: 15px;
  padding: 10px 20px;
  border: 2px solid var(--accent);
  color: var(--accent);
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  z-index: 1000;
}

#music-btn { left: 50%; transform: translateX(-110%); }
#next-btn { left: 50%; transform: translateX(10%); }

/* PERFIL */
#links-panel {
  position: fixed;
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.profile-container {
  position: relative;
  width: 360px;
  height: 210px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 20px var(--accent);
}

.profile-banner {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-img {
  position: absolute;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 3px solid var(--accent);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* LINKS */
#links-panel a {
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--accent);
  padding: 8px 12px;
  border-radius: 6px;
  min-width: 200px;
  text-align: center;
  transition: 0.3s;
}

/* 🔥 EFEITO NEON */
#links-panel a:hover {
  color: #fff;
  box-shadow: 0 0 10px var(--accent),
              0 0 20px var(--accent),
              0 0 40px var(--accent);
  text-shadow: 0 0 5px #fff,
               0 0 10px var(--accent);
  transform: scale(1.05);
}

#chat-box {

  bottom: 20px;
  width: 320px;

  background: rgba(0, 0, 0, 0.6); /* fundo escuro transparente */
  backdrop-filter: blur(4px);     /* efeito vidro (top) */
  border-radius: 8px;
}

#chat-header {
  color: var(--accent);

}

#chat-messages {

}

.msg {
  margin: 4px;
  color: #FFF;
  text-shadow: 0 0 3px rgba(255,255,255,0.3);}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<audio id="bg-music"></audio>

<button id="music-btn">▶ Música</button>
<button id="next-btn">⏭ Pular</button>

<div id="links-panel">
  <div class="profile-container">
    <img src="banner.gif" class="profile-banner">
    <img src="minha-foto.jpg" class="profile-img">
  </div>

  <a href="#">YouTube</a>
  <a href="#">Twitter</a>
  <a href="#">Twitch</a>
  <a href="#">Kick</a>
</div>

<div id="chat-box">
  <div id="chat-header">Chat</div>
  <div id="chat-messages"></div>
</div>

<script>
// MATRIX
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*";
const fontSize = 16;
let columns = canvas.width / fontSize;
let drops = Array(Math.floor(columns)).fill(1);

let color = "#0F0";

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = color;
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}
setInterval(draw, 50);

// TROCA COR
setInterval(() => {
  color = (color === "#0F0") ? "#F00" : "#0F0";
  document.documentElement.style.setProperty('--accent', color);
}, 40000);

// PLAYLIST
const playlist = ["musica1.mp3","musica2.mp3","musica3.mp3"];
let currentTrack = 0;

const player = document.getElementById("bg-music");
const btn = document.getElementById("music-btn");
const nextBtn = document.getElementById("next-btn");

player.src = playlist[currentTrack];

let playing = false;

btn.addEventListener("click", async () => {
  if (!playing) {
    await player.play();
    btn.textContent = "⏸ Música";
    playing = true;
  } else {
    player.pause();
    btn.textContent = "▶ Música";
    playing = false;
  }
});

function nextTrack() {
  currentTrack = (currentTrack + 1) % playlist.length;
  player.src = playlist[currentTrack];
  if (playing) player.play();
}

nextBtn.addEventListener("click", nextTrack);
player.addEventListener("ended", nextTrack);

// 🔥 CHAT COMPLETO
const chat = document.getElementById("chat-messages");

const mensagens = [
  "<b>Neo:</b> Estou dentro da Matrix...",
  "<b>Trinity:</b> Siga-me!",
  "<b>Morpheus:</b> A pílula vermelha ou azul?",
  "<b>Agente Smith:</b> Sr. Anderson...",
  "<b>Oracle:</b> Tudo tem um propósito.",
  "<b>Douglinhas:</b> Mano, essa música é braba 🔥",
  "<b>Neo:</b> Eu sei kung fu.",
  "<b>Trinity:</b> Confie em mim.",
  "<b>Morpheus:</b> A Matrix é um sistema.",
  "<b>Lucasmacho:</b> Que vibe, mano!",
  "<b>BrunaS2:</b> Esse chat tá muito bom kkk"
];

const mensagensLoop = [
  "<b>Fuscona:</b> quero tomar pílula vermelha",
  "<b>mingal:</b> tem gente da matrix no chat 😂",
  "<b>sensei:</b> manda salve!"
];

const todasMensagens = [...mensagens, ...mensagensLoop];

setInterval(() => {
  const msg = document.createElement("div");
  msg.classList.add("msg");
  msg.innerHTML = todasMensagens[Math.floor(Math.random()*todasMensagens.length)];
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}, 2500);

</script>

</body>
</html>
