<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Matrix Hacker Full</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root { --accent: #0F0; }

body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

#music-btn, #next-btn {
  position: fixed;
  top: 15px;
  padding: 10px 20px;
  border: 2px solid var(--accent);
  color: var(--accent);
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  z-index: 1000;
}

#music-btn { left: 50%; transform: translateX(-110%); }
#next-btn { left: 50%; transform: translateX(10%); }

#links-panel {
  position: fixed;
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.profile-container {
  position: relative;
  width: 360px;
  height: 210px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 20px var(--accent);
}

.profile-banner {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-img {
  position: absolute;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 3px solid var(--accent);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

#links-panel a {
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--accent);
  padding: 8px 12px;
  border-radius: 6px;
  min-width: 200px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}

#links-panel a:hover {
  color: #fff;
  box-shadow: 0 0 10px var(--accent),
              0 0 20px var(--accent),
              0 0 40px var(--accent);
  transform: scale(1.05);
}

#chat-box {
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 320px;
  height: 240px;
  border: 1px solid var(--accent);
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  border-radius: 8px;
}

#chat-header {
  color: var(--accent);
  padding: 5px;
}

#chat-messages {
  height: 200px;
  overflow-y: auto;
  font-size: 12px;
}

.msg {
  margin: 4px;
  color: #FFF;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<audio id="bg-music"></audio>

<button id="music-btn">▶ Música</button>
<button id="next-btn">⏭ Pular</button>

<div id="links-panel">
  <div class="profile-container">
    <img src="banner.gif" class="profile-banner">
    <img src="minha-foto.jpg" class="profile-img">
  </div>

  <a href="#"><i class="fab fa-youtube"></i> YouTube</a>
  <a href="#"><i class="fab fa-twitter"></i> Twitter</a>
  <a href="#"><i class="fab fa-twitch"></i> Twitch</a>
  <a href="#"><i class="fas fa-bolt"></i> Kick</a>
</div>

<div id="chat-box">
  <div id="chat-header">Chat</div>
  <div id="chat-messages"></div>
</div>

<script>
// MATRIX OTIMIZADO
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*";
const fontSize = 18;
let columns = canvas.width / fontSize;
let drops = Array(Math.floor(columns)).fill(1);

let color = "#0F0";

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = color;
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if (drops[i]*fontSize > canvas.height && Math.random() > 0.97) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}

// 🚀 substitui setInterval por isso (sem travar)
function loop() {
  draw();
  requestAnimationFrame(loop);
}
loop();

// COR
setInterval(() => {
  color = (color === "#0F0") ? "#F00" : "#0F0";
  document.documentElement.style.setProperty('--accent', color);
}, 40000);

// CHAT INTELIGENTE
const chat = document.getElementById("chat-messages");

const todasMensagens = [
  "<b>Neo:</b> Estou dentro da Matrix...",
  "<b>Trinity:</b> Siga-me!",
  "<b>Morpheus:</b> A pílula vermelha ou azul?",
  "<b>Agente Smith:</b> Sr. Anderson...",
  "<b>Oracle:</b> Tudo tem um propósito.",
  "<b>Douglinhas:</b> Mano, essa música é braba 🔥",
  "<b>Neo:</b> Eu sei kung fu.",
  "<b>Trinity:</b> Confie em mim.",
  "<b>Lucasmacho:</b> Que vibe, mano!",
  "<b>BrunaS2:</b> Esse chat tá muito bom kkk",
  "<b>Fuscona:</b> quero tomar pílula vermelha",
  "<b>mingal:</b> tem gente da matrix no chat 😂",
  "<b>sensei:</b> manda salve!"
];

let mensagensRestantes = [...todasMensagens];
let nomesUsados = [];

setInterval(() => {
  if (mensagensRestantes.length === 0) {
    mensagensRestantes = [...todasMensagens];
    nomesUsados = [];
  }

  let novaMensagem;
  let nome;

  do {
    const index = Math.floor(Math.random() * mensagensRestantes.length);
    novaMensagem = mensagensRestantes[index];
    nome = novaMensagem.split(":")[0];
  } while (nomesUsados.includes(nome));

  nomesUsados.push(nome);
  mensagensRestantes = mensagensRestantes.filter(msg => msg !== novaMensagem);

  const msg = document.createElement("div");
  msg.classList.add("msg");
  msg.innerHTML = novaMensagem;

  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;

}, 2500);
</script>

</body>
</html>
