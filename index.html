<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Matrix Verde e Vermelha</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root { --accent: #0F0; }

    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: monospace;
    }

    canvas { display: block; }

    /* BOTÕES */
    #music-btn, #next-btn {
      position: fixed;
      top: 15px;
      padding: 10px 20px;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3); /* transparente */
      transition: all 0.3s ease-in-out;
      z-index: 1000;
      text-shadow: 0 0 8px var(--accent);
    }

    #music-btn:hover, #next-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    #music-btn { left: 50%; transform: translateX(-110%); }
    #next-btn { left: 50%; transform: translateX(10%); }

    /* LINKS */
    #links-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    #links-panel a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      border: 1px solid var(--accent);
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.3);
      text-align: center;
      text-shadow: 0 0 6px var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      min-width: 200px;
      transition: all 0.3s;
    }

    #links-panel a:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FFF;
    }

    /* CHAT */
    #chat-box{
      position: fixed;
      left: 20px;
      bottom: 20px;
      width: 360px;
      height: 260px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--accent);
      border-radius: 8px;
      overflow: hidden;
      z-index: 2000;
      backdrop-filter: blur(4px);
    }

    #chat-header{
      padding: 6px 10px;
      font-weight: bold;
      color: var(--accent);
      text-shadow: 0 0 6px var(--accent);
      display:flex; align-items:center; gap:8px;
    }

    #chat-messages{
      height: calc(100% - 30px);
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg{
      background: rgba(15,22,32,0.6);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 6px 8px;
      color: #dfffdc;
      animation: chatIn .18s ease forwards;
    }

    @keyframes chatIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <canvas id="matrix"></canvas>

  <audio id="bg-music"></audio>

  <button id="music-btn">▶ Música</button>
  <button id="next-btn">⏭ Pular</button>

  <div id="links-panel">
    <a href="#">YouTube</a>
    <a href="#">Twitter</a>
    <a href="#">Twitch</a>
    <a href="#">Kick</a>
  </div>

  <div id="chat-box">
    <div id="chat-header">Chat</div>
    <div id="chat-messages"></div>
  </div>

<script>
// ===== MATRIX =====
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

const letters = "01ABCDEFGHIJKLMNOPQRSTUVXYZ@#$%&*";
const fontSize = 16;
let columns, drops;

let color = "#0F0";
let speed = 80;
let lastTime = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  columns = Math.floor(canvas.width / fontSize);
  drops = Array(columns).fill(1);
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function draw(now) {
  if (now - lastTime > speed) {
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = color;
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const text = letters[Math.floor(Math.random()*letters.length)];
      ctx.fillText(text, i * fontSize, drops[i]*fontSize);

      if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }

    lastTime = now;
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// 🔴🟢 TROCA DE COR GLOBAL
setInterval(() => {
  color = (color === "#0F0") ? "#F00" : "#0F0";
  document.documentElement.style.setProperty('--accent', color);
}, 50000);


// ===== PLAYLIST =====
const playlist = [
  "musica1.mp3",
  "musica2.mp3",
  "musica3.mp3",
  "musica4.mp3",
  "musica5.mp3",
  "musica6.mp3"
];

let currentTrack = 0;
const player = document.getElementById("bg-music");
const btn = document.getElementById("music-btn");
const nextBtn = document.getElementById("next-btn");

player.src = playlist[currentTrack];

let playing = false;

btn.addEventListener("click", async () => {
  try {
    if (!playing) {
      await player.play();
      btn.textContent = "⏸ Música";
      playing = true;
    } else {
      player.pause();
      btn.textContent = "▶ Música";
      playing = false;
    }
  } catch (e) {
    console.log(e);
  }
});

function nextTrack() {
  currentTrack = (currentTrack + 1) % playlist.length;
  player.src = playlist[currentTrack];
  if (playing) player.play();
}

nextBtn.addEventListener("click", nextTrack);
player.addEventListener("ended", nextTrack);


// ===== CHAT =====
const mensagens = [
  "<b>Neo:</b> Estou dentro da Matrix...",
  "<b>Trinity:</b> Siga-me!",
  "<b>Morpheus:</b> A pílula vermelha ou azul?",
  "<b>Agente Smith:</b> Sr. Anderson...",
  "<b>Oracle:</b> Tudo tem um propósito.",
  "<b>Neo:</b> Eu sei kung fu."
];

const chatBox = document.getElementById("chat-messages");

function addMensagem() {
  const msg = document.createElement("div");
  msg.classList.add("msg");
  msg.innerHTML = mensagens[Math.floor(Math.random()*mensagens.length)];
  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
}

setInterval(addMensagem, 4000);

</script>

</body>
</html>
